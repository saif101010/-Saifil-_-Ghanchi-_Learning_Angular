<!-- student-list.component.html -->
<tr *ngFor="let student of userlist">
  <td>{{ student.id }}</td>
  <td>{{ student.firstName }} {{ student.lastName }}</td>
  <!-- Pipe 1: UpperCasePipe -->
  <td>{{ student.department | uppercase }}</td>
  <!-- Pipe 2: DatePipe -->
  <td>{{ student.enrollmentDate | date:'longDate' }}</td>
  <!-- Pipe 3: CurrencyPipe -->
  <td>{{ student.tuition | currency:'CAD':'symbol' }}</td>
</tr>
